name: Test
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'catalog.json'
      - '.github/workflows/**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Validate configuration and render snapshots offline
        run: python scripts/update.py --catalog catalog.json --root . --render-only
