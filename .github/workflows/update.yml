name: Update software catalog
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-software-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect official releases
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update.py --catalog catalog.json --root . --strict
      - name: Commit snapshots and Markdown including failure status
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ docs/software/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh software releases and collection status'
            git push origin HEAD:main
          fi
      - name: Report collection failure
        if: ${{ steps.collect.outcome == 'failure' }}
        run: |
          echo 'Some upstream sources failed; see committed collection status and job logs.'
          exit 1
